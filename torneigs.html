<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Torneigs · CB Sant Josep</title>
  <style>
    :root {
      --brand:#713f97; --brand-dark:#5a2f7d; --accent:#fcdb20;
      --bg:#f5f3f8; --card:#ffffff; --ink:#2a2233; --muted:#7a7085;
      --line:#e6e0ee; --shadow:0 1px 3px rgba(60,40,90,0.08),0 4px 16px rgba(60,40,90,0.06); --radius:16px;
      --masc:#1565c0; --fem:#c2185b;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { display:flex; align-items:center; gap:14px; padding:16px 20px;
      background:var(--brand); color:#fff; box-shadow:var(--shadow); }
    .htext h1 { margin:0; font-size:1.05rem; font-weight:700; letter-spacing:-0.01em; }
    .htext h1 .club { display:block; font-size:0.72rem; font-weight:500; opacity:0.85; letter-spacing:0.04em; text-transform:uppercase; }
    .htext p { margin:2px 0 0; font-size:0.8rem; opacity:0.9; }
    main { max-width:1080px; margin:0 auto; padding:22px 16px 60px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .back { display:inline-flex; align-items:center; gap:6px; color:var(--brand); text-decoration:none; font-weight:700; font-size:0.88rem; }
    .status { color:var(--muted); font-size:0.82rem; text-align:right; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .summary-item { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
    .summary-label { display:block; color:var(--muted); font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:800; }
    .summary-value { display:block; color:var(--brand-dark); font-size:1.45rem; font-weight:900; margin-top:2px; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
    .chip { border:1px solid var(--line); background:#fff; color:var(--brand-dark); border-radius:999px;
      padding:7px 11px; font-weight:800; font-size:0.78rem; cursor:pointer; }
    .chip.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .section-title { color:var(--brand-dark); font-size:1rem; margin:24px 0 10px; }
    .tournament-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .tournament { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; }
    .tournament-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:10px; }
    .tournament-title { margin:0; color:var(--brand-dark); font-size:1rem; line-height:1.2; }
    .tournament-meta { margin:4px 0 0; color:var(--muted); font-size:0.78rem; }
    .count { flex:0 0 auto; background:var(--accent); color:var(--brand-dark); border-radius:999px; padding:4px 9px; font-size:0.74rem; font-weight:900; }
    .games { display:flex; flex-direction:column; gap:8px; }
    .game { border:1px solid var(--line); border-radius:12px; padding:9px 10px; background:#fff; }
    .game.masc { border-left:5px solid var(--masc); background:#f2f8fe; }
    .game.fem { border-left:5px solid var(--fem); background:#fdf3f7; }
    .game-top { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .time { color:var(--brand-dark); font-weight:900; font-size:0.86rem; }
    .team { font-weight:900; font-size:0.88rem; }
    .badge { font-size:0.66rem; font-weight:900; padding:2px 7px; border-radius:6px; text-transform:uppercase; letter-spacing:0.03em; background:#ede7f6; color:#4527a0; }
    .rival { margin-top:3px; font-size:0.82rem; }
    .rival .lbl, .cost-label { color:var(--muted); font-size:0.74rem; }
    .cost { margin-top:3px; color:var(--brand-dark); font-size:0.78rem; font-weight:900; }
    .doc-link { display:inline-flex; margin-top:8px; color:var(--brand); font-size:0.78rem; font-weight:900; text-decoration:none; }
    .notes { display:flex; flex-direction:column; gap:5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
    .note { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:0.78rem; }
    .note strong { color:var(--brand-dark); }
    .empty { background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); padding:24px; color:var(--muted); text-align:center; }
    footer { text-align:center; color:var(--muted); font-size:0.75rem; padding:20px; }
  </style>
</head>
<body>
  <header>
    <div class="htext">
      <h1><span class="club">CB Sant Josep de Badalona</span> Torneigs</h1>
      <p>Temporada 26-27</p>
    </div>
  </header>
  <main>
    <div class="topbar">
      <a class="back" href="index.html">← Tornar</a>
      <div id="status" class="status">Carregant dades…</div>
    </div>

    <section class="summary" aria-label="Resum de torneigs">
      <div class="summary-item"><span class="summary-label">Torneigs</span><span id="totalGroups" class="summary-value">0</span></div>
      <div class="summary-item"><span class="summary-label">Participants</span><span id="totalGames" class="summary-value">0</span></div>
      <div class="summary-item"><span class="summary-label">Equips</span><span id="totalTeams" class="summary-value">0</span></div>
      <div class="summary-item"><span class="summary-label">Import total</span><span id="totalCost" class="summary-value">0€</span></div>
    </section>

    <div id="filters" class="filters"></div>
    <div id="content"></div>
  </main>
  <footer>Font: Google Sheet de torneigs de la temporada</footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1PSum1wV8wQIS1yA9O5JwEVKKqL7TBI3B1_EJ7avkUR0/export?format=csv';
    const FAMILY_ORDER = ['SÈNIOR','JÚNIOR','CADET','INFANTIL','MINI','PREMINI'];
    const TEAM_META = {
      IBM:{ team:'Infantil B', fam:'INFANTIL', sex:'M' }, IAM:{ team:'Infantil A', fam:'INFANTIL', sex:'M' }, IF:{ team:'Infantil', fam:'INFANTIL', sex:'F' },
      CAM:{ team:'Cadet A', fam:'CADET', sex:'M' }, CBM:{ team:'Cadet B', fam:'CADET', sex:'M' }, CF:{ team:'Cadet', fam:'CADET', sex:'F' },
      JAM:{ team:'Júnior A', fam:'JÚNIOR', sex:'M' }, JBM:{ team:'Júnior B', fam:'JÚNIOR', sex:'M' }, JAF:{ team:'Júnior A', fam:'JÚNIOR', sex:'F' }, JBF:{ team:'Júnior B', fam:'JÚNIOR', sex:'F' },
      SAM:{ team:'Sènior A', fam:'SÈNIOR', sex:'M' }, SBM:{ team:'Sènior B', fam:'SÈNIOR', sex:'M' }, SAF:{ team:'Sènior A', fam:'SÈNIOR', sex:'F' },
      MAM:{ team:'Mini A', fam:'MINI', sex:'M' }, MBM:{ team:'Mini B', fam:'MINI', sex:'M' }, MF:{ team:'Mini', fam:'MINI', sex:'F' },
      PAM:{ team:'Premini A', fam:'PREMINI', sex:'M' }, PBM:{ team:'Premini B', fam:'PREMINI', sex:'M' }
    };
    const activeFamilies = new Set();
    const activeSex = new Set();

    function esc(value){
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function parseCsv(text){
      const rows = [];
      let row = [], cell = '', quoted = false;
      for(let i = 0; i < text.length; i++){
        const ch = text[i], next = text[i + 1];
        if(quoted){
          if(ch === '"' && next === '"'){ cell += '"'; i++; }
          else if(ch === '"'){ quoted = false; }
          else cell += ch;
        } else if(ch === '"') {
          quoted = true;
        } else if(ch === ',') {
          row.push(cell); cell = '';
        } else if(ch === '\n') {
          row.push(cell); rows.push(row); row = []; cell = '';
        } else if(ch !== '\r') {
          cell += ch;
        }
      }
      row.push(cell); rows.push(row);
      return rows.map(r => r.map(c => c.trim()));
    }
    function firstUrl(rows){
      for(const row of rows) for(const cell of row) if(/^https?:\/\//.test(cell)) return cell;
      return '';
    }
    function parseMoney(value){
      const raw = String(value || '').replace(/\./g,'').replace(',', '.').replace(/[^\d.-]/g, '');
      const n = Number(raw);
      return Number.isFinite(n) ? n : null;
    }
    function inferTeam(block){
      for(const row of block){
        for(const cell of row){
          const code = cell.toUpperCase().replace(/\s+/g,'');
          if(TEAM_META[code]) return { code, ...TEAM_META[code] };
        }
      }
      return { code:'', team:'Equip pendent', fam:'', sex:'' };
    }
    function inferCategory(block){
      const candidates = [];
      block.slice(0, 10).forEach(row => row.forEach(cell => {
        if(cell && !/^TORNEIG/i.test(cell) && !/^DIES$/i.test(cell) && !/^https?:\/\//.test(cell) && !/^\d{4}$/.test(cell) && !TEAM_META[cell.toUpperCase().replace(/\s+/g,'')]){
          candidates.push(cell);
        }
      }));
      return candidates.find(cell => /CAT|INTER|ANY|PREF|PROM|NIVELL/i.test(cell)) || '';
    }
    function parseTournament(block, index){
      const flat = block.flat().filter(Boolean);
      const title = flat.find(cell => /^TORNEIG/i.test(cell)) || `Torneig ${index + 1}`;
      let dates = '';
      block.forEach(row => {
        row.forEach((cell, idx) => {
          if(/^DIES$/i.test(cell)) dates = row.slice(idx + 1).find(Boolean) || dates;
        });
      });
      const team = inferTeam(block);
      const year = flat.find(cell => /^\d{4}$/.test(cell)) || '';
      const participants = [];
      const notes = [];
      block.forEach(row => {
        if(/^\d+$/.test(row[1] || '') && row[3]){
          participants.push({ order:row[1], number:row[2] || '', name:row[3] });
        }
        const label = row[5] || '';
        const amount = parseMoney(row[6]);
        if(label || amount != null) notes.push({ label, amount });
      });
      return {
        id: String(index),
        title,
        dates,
        link: firstUrl(block),
        category: inferCategory(block),
        year,
        participants,
        notes,
        ...team
      };
    }
    function parseTournaments(text){
      const rows = parseCsv(text);
      const starts = [];
      rows.forEach((row, idx) => {
        if(row.some(cell => /^TORNEIG/i.test(cell))) starts.push(idx);
      });
      return starts.map((start, idx) => {
        const end = starts[idx + 1] == null ? rows.length : starts[idx + 1];
        return parseTournament(rows.slice(start, end), idx);
      });
    }
    function passes(tournament){
      return (!activeFamilies.size || activeFamilies.has(tournament.fam)) &&
        (!activeSex.size || activeSex.has(tournament.sex));
    }
    function renderFilters(tournaments){
      const filters = document.getElementById('filters');
      const families = FAMILY_ORDER.filter(fam => tournaments.some(t => t.fam === fam));
      const buttons = [];
      families.forEach(fam => buttons.push(`<button class="chip" data-kind="fam" data-value="${esc(fam)}">${esc(fam)}</button>`));
      [['M','Masculí'],['F','Femení']].forEach(([value,label]) => {
        if(tournaments.some(t => t.sex === value)) buttons.push(`<button class="chip" data-kind="sex" data-value="${value}">${label}</button>`);
      });
      filters.innerHTML = buttons.join('');
      filters.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          const set = button.dataset.kind === 'fam' ? activeFamilies : activeSex;
          const value = button.dataset.value;
          if(set.has(value)) set.delete(value); else set.add(value);
          render(tournaments);
        });
      });
    }
    function syncFilterState(){
      document.querySelectorAll('.chip').forEach(button => {
        const set = button.dataset.kind === 'fam' ? activeFamilies : activeSex;
        button.classList.toggle('active', set.has(button.dataset.value));
      });
    }
    function render(tournaments){
      syncFilterState();
      const filtered = tournaments.filter(passes);
      const teams = new Set(filtered.map(t => t.team + ' ' + t.sex));
      const cost = filtered.reduce((sum, t) => sum + t.notes.reduce((s, note) => s + (note.amount || 0), 0), 0);
      document.getElementById('totalGroups').textContent = filtered.length;
      document.getElementById('totalGames').textContent = filtered.reduce((sum, t) => sum + t.participants.length, 0);
      document.getElementById('totalTeams').textContent = teams.size;
      document.getElementById('totalCost').textContent = cost ? cost.toLocaleString('ca-ES', { maximumFractionDigits:1 }) + '€' : '0€';

      const content = document.getElementById('content');
      if(!filtered.length){
        content.innerHTML = '<div class="empty">No hi ha torneigs amb aquests filtres.</div>';
        return;
      }
      content.innerHTML = `<div class="tournament-grid">${filtered.map(tournament => {
        const total = tournament.notes.reduce((sum, note) => sum + (note.amount || 0), 0);
        const peopleHtml = tournament.participants.slice(0, 14).map(person => `
          <article class="game ${tournament.sex === 'F' ? 'fem' : 'masc'}">
            <div class="game-top">
              ${person.number ? `<span class="time">#${esc(person.number)}</span>` : ''}
              <span class="team">${esc(person.name)}</span>
            </div>
          </article>`).join('');
        const notesHtml = tournament.notes.length ? `<div class="notes">${tournament.notes.map(note => `
          <div class="note"><span>${esc(note.label || 'Import')}</span>${note.amount != null ? `<strong>${note.amount.toLocaleString('ca-ES', { maximumFractionDigits:2 })}€</strong>` : ''}</div>`).join('')}</div>` : '';
        return `
          <section class="tournament">
            <div class="tournament-head">
              <div>
                <h2 class="tournament-title">${esc(tournament.title)}</h2>
                <p class="tournament-meta">${esc(tournament.dates || 'Dates pendents')} · ${esc(tournament.team)} ${esc(tournament.sex)}${tournament.category ? ' · ' + esc(tournament.category) : ''}${tournament.year ? ' · ' + esc(tournament.year) : ''}${total ? ' · ' + total.toLocaleString('ca-ES', { maximumFractionDigits:1 }) + '€' : ''}</p>
                ${tournament.link ? `<a class="doc-link" href="${esc(tournament.link)}" target="_blank" rel="noopener">Veure document del torneig →</a>` : ''}
              </div>
              <span class="count">${tournament.participants.length}</span>
            </div>
            <div class="games">${peopleHtml}</div>
            ${notesHtml}
          </section>`;
      }).join('')}</div>`;
    }
    async function load(){
      try {
        const csv = await fetch(SHEET_CSV_URL, { cache:'no-store' }).then(res => {
          if(!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        });
        const tournaments = parseTournaments(csv);
        document.getElementById('status').textContent = 'Actualitzat des del Google Sheet';
        renderFilters(tournaments);
        render(tournaments);
      } catch (error) {
        document.getElementById('status').textContent = 'Error carregant dades';
        document.getElementById('content').innerHTML = '<div class="empty">No s’han pogut carregar les dades del Google Sheet.</div>';
      }
    }
    load();
  </script>
</body>
</html>
