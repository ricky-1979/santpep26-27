name: Actualitza partits

# Baixa els calendaris de partits (masculí i femení), regenera les dades
# incrustades a partits.html, fa commit a main si hi ha canvis i, tot seguit,
# desplega a GitHub Pages dins el mateix run.
#
# Per què desplega aquí mateix: un commit fet pel github-actions[bot] amb el
# GITHUB_TOKEN NO dispara altres workflows (limitació de GitHub), així que el
# workflow de desplegament (pages.yml) no s'activaria per aquest commit. Per
# tenir l'actualització 100% automàtica, publiquem des d'aquest mateix job.

on:
  schedule:
    # Mitjanit hora de Badalona tot l'any. GitHub cron és sempre UTC i Badalona
    # canvia entre CEST (UTC+2, estiu) i CET (UTC+1, hivern), així que disparem
    # a les dues hores possibles; el job "gate" deixa passar només el que a
    # Badalona són les 00:00 i cancel·la l'altre (que allà és la 01:00).
    - cron: "0 22 * * *" # 00:00 a Badalona a l'estiu (CEST, UTC+2)
    - cron: "0 23 * * *" # 00:00 a Badalona a l'hivern (CET, UTC+1)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Comparteix grup amb pages.yml perquè els desplegaments se serialitzin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decideix si cal executar: sempre en dispar manual; en cron, només si a
  # Badalona són les 00:00. Així el run que no toca acaba en "success" net,
  # sense generar notificacions de fallida.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Dispar manual: s'executa."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=$(TZ="Europe/Madrid" date +%H)
          echo "Hora local a Badalona: ${H}h"
          if [ "$H" = "00" ]; then
            echo "És mitjanit a Badalona: s'executa."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No és mitjanit local: es descarta aquesta execució."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Actualitza les dades de partits
        run: node scripts/update-partits.js

      - name: Avisa canvis per WhatsApp
        if: ${{ !cancelled() }}
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: node scripts/notify-partits-whatsapp.js

      - name: Commit si hi ha canvis
        run: |
          if git diff --quiet -- partits.html; then
            echo "Sense canvis als partits."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add partits.html
            git commit -m "Actualitza partits des dels calendaris (masc + fem)"
            git push
          fi

      # --- Desplegament a Pages (des dels fitxers ja actualitzats) ---
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # El backend de Pages retorna sovint "Deployment failed, try again
      # later." al primer intent (error transitori, no del build). Reintentem
      # automàticament fins a 3 cops perquè no calgui re-desplegar a mà.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 15

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30

      # Tercer intent: aquest SÍ fa fallar el job si també falla.
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
